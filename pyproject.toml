[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gozcu-gcs"
version = "0.1.0"
description = "Browser-based ground station for the Gözcü visual detect-and-avoid system"
readme = "README.md"
requires-python = ">=3.12"
# Exact versions: the project must behave the same on every machine until we
# upgrade on purpose.
dependencies = [
    "pymavlink==2.4.50",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[tool.setuptools.packages.find]
include = ["gcs*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
