# Gözcü GCS settings. Copy this file to config.toml (ignored by git) and edit the
# copy; any setting left out keeps the default shown here.

[mavlink]
# pymavlink connection string, e.g. "tcp:127.0.0.1:5762", "udpin:0.0.0.0:14551" or
# "/dev/ttyUSB0,57600".
connection = "tcp:127.0.0.1:5762"
# Our MAVLink identity. 250 lies outside ArduPilot's MAV_GCS_SYSID (255) on purpose,
# so this monitoring station never counts as the vehicle's failsafe GCS.
sysid = 250
compid = 190
# Component id of the autopilot to lock onto.
target_compid = 1
# Seconds without an autopilot heartbeat before the link is reported LOST.
link_lost_s = 3.0
# Ask the autopilot for the message rates the GCS needs. Turn this off on a link
# shared with another ground station that manages the rates itself.
request_rates = true
# Component id of Gözcü, on the same system as the autopilot
# (docs/message_contract.md).
gozcu_compid = 191

[server]
host = "127.0.0.1"
port = 8000

[recording]
# Write each session to a JSON Lines file: every event, plus the field values a few
# times a second (a few MB per hour).
enabled = true
# Folder for the files. Empty means a "Gözcü GCS logs" folder on the desktop that
# ~/.config/user-dirs.dirs names (the home folder if there is none). "~" is the
# home folder, e.g. "~/Masaüstü/Gözcü GCS logs".
directory = ""
# How often the field values are written, in Hz (at most 10; events always are).
values_hz = 2.0

[map]
# Background tiles, {z}/{x}/{y} filled in by the map. Empty means no tiles: the map
# then shows a grid under the track. OpenStreetMap's tile servers need internet,
# a visible attribution, and must not be bulk-downloaded or used offline
# (https://operations.osmfoundation.org/policies/tiles/).
tile_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
attribution = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
max_zoom = 19

[video]
# The camera stream: MPEG-TS carrying H.264 on UDP. The Gazebo camera plugin sends
# it to 127.0.0.1:5600 once its streaming is enabled.
enabled = true
# The address to receive on: "0.0.0.0" also takes a stream from another machine.
host = "127.0.0.1"
port = 5600
# At most this many frames a second go to the browser; 0 sends every frame the camera
# sends. Fewer frames cost less CPU. Recording always keeps the whole stream.
max_fps = 0.0
# The program that turns the video into pictures for the browser
# (sudo apt install ffmpeg). Without it there is no picture, but recording works.
ffmpeg = "ffmpeg"
# The camera's horizontal field of view, in degrees, for marking Gözcü's tracks on the
# picture. 64.7 is Gazebo's nose camera (horizontal_fov 1.13 rad); use the real camera's.
hfov_deg = 64.7
